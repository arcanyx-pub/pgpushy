[workspace]
resolver = "3"
members = ["pgpushy-core", "pgpushy"]
# The example is a workspace of its own on purpose: it stands in for a
# consuming project, with its own lockfile pinning snowdrop-id-postgres.
exclude = ["example"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/arcanyx-pub/pgpushy"
