[package]
name = "pgpushy"
description = "Declarative Postgres schema management at the database level, powered by pgschema"
readme = "../README.md"
keywords = ["postgres", "schema", "migration", "declarative", "pgschema"]
categories = ["database", "command-line-utilities"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pgpushy-core = { version = "0.1.0", path = "../pgpushy-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
postgres = "0.19"
semver = "1"
tempfile = "3"
which = "8"

[dev-dependencies]
assert_cmd = "2"
postgres = "0.19"
predicates = "3"
tempfile = "3"
