[package]
name = "pgpushy"
description = "Declarative Postgres schema management at the database level, powered by pgschema"
readme = "../README.md"
keywords = ["postgres", "schema", "migration", "declarative", "pgschema"]
categories = ["database", "command-line-utilities"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pgpushy-core = { version = "0.3.1", path = "../pgpushy-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
postgres = "0.19"
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-native-certs = "0.8"
semver = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }
toml = "0.9"
ureq = { version = "3", default-features = false, features = ["rustls"] }
which = "8"

[dev-dependencies]
assert_cmd = "2"
postgres = "0.19"
predicates = "3"
tempfile = "3"
